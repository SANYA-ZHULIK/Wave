<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#12051f"
    >

    <title>Wave</title>


    <!-- Montserrat -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Telegram WebApp -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/landing.css"
    >

    <link
        rel="stylesheet"
        href="css/network.css"
    >

</head>


<body>


    <!-- =================================
         ЛОГОТИП
    ================================== -->

    <header class="logo-area">

        <h1>WAVE</h1>

    </header>

         СЕТКА ЗНАКОМСТВ
    ================================== -->

    <section class="wave-network">


        <!-- Орбиты -->

        <div class="network-orbit inner"></div>

        <div class="network-orbit outer"></div>



        <!-- Фиолетовые точки -->

        <div class="network-dot dot-1"></div>

        <div class="network-dot dot-2"></div>

        <div class="network-dot dot-3"></div>

        <div class="network-dot dot-4"></div>

        <div class="network-dot dot-5"></div>

        <div class="network-dot dot-6"></div>



        <!-- =================================
             ФОТОГРАФИИ ВОКРУГ
        ================================== -->

        <div class="network-item item-1">
            <img
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80"
                alt=""
            >
        </div>


        <div class="network-item item-2">
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80"

            <img
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80"

        </div>


        <div class="network-item item-4">
            <img
                src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&q=80"

        </div>


        <div class="network-item item-5">
            <img
                src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&q=80"
                alt=""
            >
        </div>


        <div class="network-item item-6">
            <img
                src="https://images.unsplash.com/photo-1504593811423-6dd665756598?w=100&q=80"
                alt=""
            >
        </div>


        <div class="network-item item-7">
            <img
                src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80"
                alt=""
            >
        </div>


        <div class="network-item item-8">
            <img
                src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80"

        </div>


        <div class="network-item item-10">
            <img
                src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&q=80"
                alt=""
            >
        </div>



        <!-- =================================
             ЦЕНТРАЛЬНАЯ ФОТОГРАФИЯ
        ================================== -->

        <div class="network-center">

            <img
                src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=300&q=85"
                alt=""
            >

        </div>


    </section>



    <!-- =================================
         НИЖНИЙ КОНТЕНТ
    ================================== -->

    <main class="content">


        <p class="subtitle">
            Лови свою волну прямо сейчас
        </p>


        <button
            class="cta-button"
            id="startButton"
        >
            Начать
        </button>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer class="footer">

        Wave · 2026

    </footer>
